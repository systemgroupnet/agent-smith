services:
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    container_name: codereview-atlassian-mcp
    restart: unless-stopped
    env_file:
      - .env.mcp.atlassian
    networks:
      - codereview-network
    command: ["--transport", "streamable-http", "--port", "9000"]
    ports:
      - "3011:9000"

  mcp-gitlab:
    image: iwakitakuma/gitlab-mcp
    container_name: codereview-gitlab-mcp
    restart: unless-stopped
    env_file:
      - .env.mcp.gitlab
    networks:
      - codereview-network
    ports:
      - "3010:3002"

  codereviewagent:
    build:
      context: ./reviewer
      dockerfile: Dockerfile
    image: registry.example.com/code-reviewer:v0.0.1
    container_name: codereviewagent
    restart: unless-stopped
    depends_on:
      - mcp-atlassian
      - mcp-gitlab
      - collector
    env_file:
      - .env
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL}
      - JIRA_URL=${JIRA_URL}
      - JIRA_PERSONAL_ACCESS_TOKEN=${JIRA_PERSONAL_ACCESS_TOKEN}
      - CONFLUENCE_URL=${CONFLUENCE_URL}
      - CONFLUENCE_PERSONAL_ACCESS_TOKEN=${CONFLUENCE_PERSONAL_ACCESS_TOKEN}
      - MCP_ATLASSIAN_ENABLED=${MCP_ATLASSIAN_ENABLED:-false}
      - MCP_ATLASSIAN_URL=${MCP_ATLASSIAN_URL:-http://mcp-atlassian:9000}
      - MCP_ATLASSIAN_TRANSPORT=${MCP_ATLASSIAN_TRANSPORT:-streamable-http}
      - MCP_GITLAB_ENABLED=true
      - MCP_GITLAB_URL=${MCP_GITLAB_URL:-http://mcp-gitlab:3002}
      - MCP_GITLAB_TRANSPORT=${MCP_GITLAB_TRANSPORT:-streamable-http}
      - MCP_AIAND_ENABLED=${MCP_AIAND_ENABLED:-true}
      - MCP_AIAND_URL=${MCP_AIAND_URL:-http://internal.example.com/mcp}
      - MCP_AIAND_TRANSPORT=${MCP_AIAND_TRANSPORT:-streamable-http}
      - GITLAB_URL=${GITLAB_URL}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      # Run analytics — opt-in. Off by default so a reviewer run never depends on
      # the collector being reachable (e.g. in one-shot GitLab CI containers).
      - COLLECTOR_ENABLED=${COLLECTOR_ENABLED:-false}
      - COLLECTOR_URL=${COLLECTOR_URL:-http://collector:8000}
      - COLLECTOR_TOKEN=${COLLECTOR_TOKEN:-}
    volumes:
      - ./reviewer:/app
      - ./.env:/app/.env:ro
    networks:
      - codereview-network
    ports:
      - "5000:5000"
    command: python app.py

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    image: codereviewagent-collector:local
    container_name: codereview-collector
    restart: unless-stopped
    depends_on:
      collector-db:
        condition: service_healthy
    environment:
      # Store in the local Postgres (same engine as prod, DevLake-compatible).
      - COLLECTOR_DATABASE_URL=${COLLECTOR_DATABASE_URL:-postgresql+psycopg://postgres:postgres@collector-db:5432/collector}
      # When set, POST /api/events requires a matching X-Collector-Token header.
      - COLLECTOR_TOKEN=${COLLECTOR_TOKEN:-}
    networks:
      - codereview-network
    ports:
      - "8000:8000"

  collector-db:
    image: ${POSTGRES_IMAGE:-postgres:18}
    container_name: codereview-collector-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=collector
    volumes:
      # Postgres 18+ wants the mount at /var/lib/postgresql (PGDATA is in a
      # version-specific subdir below it), not /var/lib/postgresql/data.
      - collector-db-data:/var/lib/postgresql
    networks:
      - codereview-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collector"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  codereview-network:
    driver: bridge

volumes:
  collector-db-data:
