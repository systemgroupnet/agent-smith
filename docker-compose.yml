services:
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:latest # Replace with your actual MCP Atlassian image
    container_name: mcp-atlassian
    restart: unless-stopped
    environment:
      - JIRA_URL=${JIRA_URL}
      - JIRA_PERSONAL_ACCESS_TOKEN=${JIRA_PERSONAL_ACCESS_TOKEN}
      - CONFLUENCE_URL=${CONFLUENCE_URL}
      - CONFLUENCE_PERSONAL_ACCESS_TOKEN=${CONFLUENCE_PERSONAL_ACCESS_TOKEN}
      # Enable HTTP/SSE transport for MCP
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
    networks:
      - codereview-network
    ports:
      - "3000:8080" # Expose MCP HTTP endpoint
    volumes:
      - ./mcp-config:/app/config

  mcp-gitlab:
    image: iwakitakuma/gitlab-mcp
    container_name: mcp-gitlab
    restart: unless-stopped
    environment:
      - GITLAB_API_URL=${GITLAB_URL}
      - GITLAB_PERSONAL_ACCESS_TOKEN=${GITLAB_TOKEN}
      # Enable HTTP/SSE transport for MCP (streamable HTTP)
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8888
    networks:
      - codereview-network
    ports:
      - "3001:8888" # Expose MCP HTTP endpoint
    volumes:
      - ./mcp-gitlab-config:/app/config

  codereviewagent:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: registry.example.com/code-reviewer:v0.0.1
    container_name: codereviewagent
    restart: unless-stopped
    depends_on:
      - mcp-atlassian
      - mcp-gitlab
    dns:
      - 10.0.0.53
      - 8.8.8.8
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JIRA_URL=${JIRA_URL}
      - JIRA_PERSONAL_ACCESS_TOKEN=${JIRA_PERSONAL_ACCESS_TOKEN}
      - CONFLUENCE_URL=${CONFLUENCE_URL}
      - CONFLUENCE_PERSONAL_ACCESS_TOKEN=${CONFLUENCE_PERSONAL_ACCESS_TOKEN}
      # MCP Atlassian Configuration (HTTP/SSE Transport)
      - MCP_ATLASSIAN_ENABLED=${MCP_ATLASSIAN_ENABLED:-true}
      - MCP_ATLASSIAN_HOST=${MCP_ATLASSIAN_HOST:-mcp-atlassian}
      - MCP_ATLASSIAN_PORT=${MCP_ATLASSIAN_PORT:-8080}
      # MCP GitLab Configuration (HTTP/SSE Transport)
      - MCP_GITLAB_ENABLED=${MCP_GITLAB_ENABLED:-true}
      - MCP_GITLAB_HOST=${MCP_GITLAB_HOST:-mcp-gitlab}
      - MCP_GITLAB_PORT=${MCP_GITLAB_PORT:-8888}
      - GITLAB_URL=${GITLAB_URL}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
    volumes:
      - .:/app
      - ./.env:/app/.env:ro
    networks:
      - codereview-network
    ports:
      - "5000:5000"
    command: python app.py

networks:
  codereview-network:
    driver: bridge
