services:
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:latest # Replace with your actual MCP Atlassian image
    container_name: mcp-atlassian
    restart: unless-stopped
    environment:
      - JIRA_URL=${JIRA_URL}
      - JIRA_PERSONAL_ACCESS_TOKEN=${JIRA_PERSONAL_ACCESS_TOKEN}
      - CONFLUENCE_URL=${CONFLUENCE_URL}
      - CONFLUENCE_PERSONAL_ACCESS_TOKEN=${CONFLUENCE_PERSONAL_ACCESS_TOKEN}
    stdin_open: true
    tty: true
    networks:
      - codereview-network
    ports:
      - "3000:8080"
    volumes:
      - ./mcp-config:/app/config

  mcp-gitlab:
    image: iwakitakuma/gitlab-mcp
    container_name: mcp-gitlab
    restart: unless-stopped
    environment:
      - GITLAB_API_URL=${GITLAB_URL}
      - GITLAB_PERSONAL_ACCESS_TOKEN=${GITLAB_TOKEN}
      # STREAMABLE_HTTP disabled to use stdio mode for MCP client
      # - STREAMABLE_HTTP=true
    stdin_open: true
    tty: true
    networks:
      - codereview-network
    # Port mapping not needed for stdio mode
    # ports:
    #   - "3001:8888"
    volumes:
      - ./mcp-gitlab-config:/app/config

  codereviewagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: code-reviewer:latest
    container_name: codereviewagent
    restart: unless-stopped
    depends_on:
      - mcp-atlassian
      - mcp-gitlab
    dns:
      - 10.0.0.53
      - 8.8.8.8
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JIRA_URL=${JIRA_URL}
      - JIRA_PERSONAL_ACCESS_TOKEN=${JIRA_PERSONAL_ACCESS_TOKEN}
      - CONFLUENCE_URL=${CONFLUENCE_URL}
      - CONFLUENCE_PERSONAL_ACCESS_TOKEN=${CONFLUENCE_PERSONAL_ACCESS_TOKEN}
      - MCP_ATLASSIAN_ENABLED=${MCP_ATLASSIAN_ENABLED:-true}
      - MCP_ATLASSIAN_HOST=${MCP_ATLASSIAN_HOST:-localhost}
      - MCP_ATLASSIAN_PORT=${MCP_ATLASSIAN_PORT:-3000}
      - MCP_ATLASSIAN_CONTAINER=${MCP_ATLASSIAN_CONTAINER:-mcp-atlassian}
      - MCP_ATLASSIAN_SSH_USER=${MCP_ATLASSIAN_SSH_USER:-root}
      - MCP_GITLAB_ENABLED=${MCP_GITLAB_ENABLED:-true}
      - MCP_GITLAB_HOST=${MCP_GITLAB_HOST:-localhost}
      - MCP_GITLAB_CONTAINER=${MCP_GITLAB_CONTAINER:-mcp-gitlab}
      - MCP_GITLAB_SSH_USER=${MCP_GITLAB_SSH_USER:-root}
      - GITLAB_URL=${GITLAB_URL}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
    volumes:
      - .:/app
      - ./.env:/app/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codereview-network
    ports:
      - "5000:5000"
    command: python app.py

networks:
  codereview-network:
    driver: bridge
